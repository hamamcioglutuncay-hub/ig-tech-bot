# ig-tech-bot tasarım sistemi — bütün görsel kararlar burada.
# Renkler HEX, boyutlar piksel (tuval 1080×1350). Oranlar 0–1 arası.
# designs/ klasöründeki dosyalar bu dosyanın ÜZERİNE yazılan varyasyonlardır.

brand:
  name: SINGLEPLAYER
  handle: "@singleplayer_tr"
  logo: assets/logo.png

canvas:
  width: 1080
  height: 1350
  jpeg_quality: 90

colors:                 # logodan alındı
  bg: "#081030"         # lacivert zemin
  text: "#FFFFFF"
  text_muted: "#B9C0DC"
  teknoloji: "#00E8F8"  # camgöbeği
  oyun: "#B838F8"       # mor
  on_accent: "#081030"  # vurgu rengi üstündeki yazı

fonts:                  # OFL lisanslı, assets/fonts içinde
  heading: {file: assets/fonts/ArchivoBlack-Regular.ttf}
  body:    {file: assets/fonts/Archivo-Variable.ttf, weight: 400, width: 100}
  label:   {file: assets/fonts/Archivo-Variable.ttf, weight: 800, width: 100}

margin: 72              # kenar boşluğu

# Tur 2 (2026-11-13): B + C karışımı — B'nin panel düzeni + C'nin iki tonlu görseli ve kutulu BÜYÜK HARF başlığı
layout: panel           # overlay = metin görselin üstünde | panel = görsel üstte, metin altta düz zeminde
panel_ratio: 0.58       # (panel) metin paneli en fazla bu oranda (uzun haber)
panel_min_ratio: 0.42   # (panel) kısa haberde panel bu orana kadar küçülür, görsel büyür

background:
  tint: duotone         # none | duotone (kategori rengiyle iki tonlu)
  tint_strength: 0.3    # 0–1 (sahne okunabilsin diye düşük)
  brightness: 1.0      # arka planı hafif karart

gradient:               # (overlay) okunabilirlik için alttan koyulaşan geçiş
  extend_above_text: 260
  max_opacity: 0.94

top_shade: 0.55         # üst kenardaki logo/numara için hafif karartma

header:
  logo_size: 84
  handle_size: 27
  number_size: 27

badge:                  # kategori etiketi
  style: pill           # pill | line
  size: 25
  pad_x: 22
  pad_y: 11

title:
  font: heading
  max_size: 60
  min_size: 40
  max_lines: 3
  line_spacing: 1.26
  upper: true           # BÜYÜK HARF (Türkçe İ/I doğru)
  highlight: true       # true = her satırın arkasına kategori renginde kutu

text:
  font: body
  max_size: 34
  min_size: 26
  max_lines: 6
  line_spacing: 1.32

why:                    # "Neden önemli?" bloğu (sol kenarda kategori renginde çizgi)
  label: "NEDEN ÖNEMLİ?"
  label_size: 22
  font: body
  max_size: 29
  min_size: 23
  max_lines: 3
  line_spacing: 1.3

source:
  size: 25
  prefix: "Kaynak: "
  swipe_hint: "Kaydır →"

accent_bar: {width: 96, height: 7}

gaps: {badge_title: 26, title_text: 30, text_why: 30, text_source: 36}

cover:
  prompt: "a dark modern desk at night seen from above, a blank game controller on the left lit in violet, an open unbranded laptop and a glowing computer chip on the right lit in cyan, scattered cables, cinematic"
  kicker: "GÜNÜN"
  title: "TEKNOLOJİ & OYUN\nHABERLERİ"   # \n = satır sonu
  title_size: 96
  logo_size: 230
  list_size: 30

outro:
  title: "TAKİP ET"
  subtitle: "Her gün en güncel teknoloji & oyun haberleri"
  cta: "Kaydet  •  Paylaş  •  Yorumla"
  logo_size: 360
