# Günün carousel'ini Instagram'da yayınlar.
# approve: yalnızca elle (GitHub mobil → Actions → Instagram'da yayınla → Run workflow)
# auto:    her gün 10:00 (İstanbul) otomatik.   dry-run: hiçbir zaman yayınlamaz.
name: Instagram'da yayınla

on:
  schedule:
    - cron: "0 7 * * *"    # 07:00 UTC = 10:00 İstanbul (yalnızca MODE=auto iken çalışır)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-tech-bot
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.MODE == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ vars.MODE || 'dry-run' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      COMMIT_MSG: "Yayın kaydı"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git kimliği
        run: |
          git config user.name "ig-tech-bot"
          git config user.email "ig-tech-bot@users.noreply.github.com"
      - name: Yayınla
        run: python -m bot publish --yes
      - name: Çıktıları ve durumu kaydet
        if: always()
        run: |
          git add -A output state
          git diff --cached --quiet || git commit -m "🤖 $COMMIT_MSG $(TZ=Europe/Istanbul date +%F)"
          git pull --rebase -q && git push -q
