# Haftalık: 30 günden eski çıktı klasörlerini siler.
name: Eski görselleri temizle

on:
  schedule:
    - cron: "0 3 * * 0"    # her pazar 06:00 İstanbul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-tech-bot
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMIT_MSG: "30 günden eski çıktılar silindi"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git kimliği
        run: |
          git config user.name "ig-tech-bot"
          git config user.email "ig-tech-bot@users.noreply.github.com"
      - run: python -m bot cleanup --days 30
      - name: Çıktıları ve durumu kaydet
        if: always()
        run: |
          git add -A output state
          git diff --cached --quiet || git commit -m "🤖 $COMMIT_MSG $(TZ=Europe/Istanbul date +%F)"
          git pull --rebase -q && git push -q
