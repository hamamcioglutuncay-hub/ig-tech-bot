# Her sabah 08:30 (İstanbul) günün içeriğini üretir ve Telegram'a önizleme gönderir.
# MODE (repo değişkeni): dry-run | approve | auto — yayın burada YAPILMAZ (publish.yml).
name: İçerik üret

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC = 08:30 İstanbul
  workflow_dispatch:
    inputs:
      force:
        description: "Bugünün içeriği varsa bile yeniden üret"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-tech-bot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ vars.MODE || 'dry-run' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      COMMIT_MSG: "İçerik"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git kimliği
        run: |
          git config user.name "ig-tech-bot"
          git config user.email "ig-tech-bot@users.noreply.github.com"
      - name: Günlük akış
        run: python -m bot run ${{ inputs.force && '--force' || '' }}
      - name: Hata bildirimi
        if: failure()
        run: |
          python -c "from bot import telegram; telegram.notify('❌ ig-tech-bot – içerik üretimi başarısız. GitHub → Actions → İçerik üret logunu kontrol edin.')"
      - name: Çıktıları ve durumu kaydet
        if: always()
        run: |
          git add -A output state
          git diff --cached --quiet || git commit -m "🤖 $COMMIT_MSG $(TZ=Europe/Istanbul date +%F)"
          git pull --rebase -q && git push -q
