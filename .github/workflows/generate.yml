# Her sabah 05:07 (İstanbul) günün içeriğini üretir ve Telegram'a önizleme gönderir.
# 06:37 yedek çalıştırma: ilki başarısız olduysa ya da gecikip henüz çalışmadıysa üretir; slaytlar zaten varsa hiçbir şey yapmaz.
# MODE (repo değişkeni): dry-run | approve | auto — yayın burada YAPILMAZ (publish.yml).
name: İçerik üret

on:
  schedule:
    - cron: "7 2 * * *"    # 02:07 UTC = 05:07 İstanbul (Gemini/GitHub yoğunluğu düşük; tam saat yığılmasından kaçınır)
    - cron: "37 3 * * *"   # 03:37 UTC = 06:37 İstanbul — yedek
  workflow_dispatch:
    inputs:
      force:
        description: "Bugünün içeriği varsa bile yeniden üret"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-tech-bot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ vars.MODE || 'dry-run' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      COMMIT_MSG: "İçerik"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git kimliği
        run: |
          git config user.name "ig-tech-bot"
          git config user.email "ig-tech-bot@users.noreply.github.com"
      - name: Bugün zaten üretildi mi?
        id: done
        run: |
          D=$(TZ=Europe/Istanbul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && ls output/$D/slides/*.jpg >/dev/null 2>&1; then
            echo "$D slaytları zaten var; yedek çalıştırma atlanıyor."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Günlük akış
        if: steps.done.outputs.skip != 'true'
        run: |
          set -o pipefail
          python -m bot run ${{ inputs.force && '--force' || '' }} 2>&1 | tee run.log
      - name: Hata bildirimi
        if: failure()
        run: |
          python - <<'EOF'
          from pathlib import Path
          from bot import settings, telegram
          lines = [l for l in (Path("run.log").read_text(errors="ignore").splitlines() if Path("run.log").exists() else []) if l.strip()]
          detail = settings.scrub("\n".join(lines[-3:]))[-600:]
          telegram.notify("❌ ig-tech-bot – içerik üretimi başarısız.\n" + (detail or "Ayrıntı: GitHub → Actions → İçerik üret logu"))
          EOF
      - name: Çıktıları ve durumu kaydet
        if: always()
        run: |
          git add -A output state
          git diff --cached --quiet || git commit -m "🤖 $COMMIT_MSG $(TZ=Europe/Istanbul date +%F)"
          git pull --rebase -q && git push -q
